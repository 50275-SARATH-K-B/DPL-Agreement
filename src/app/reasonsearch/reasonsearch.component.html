<div class="card" fxFlex="100%" fxLayout="column" fxLayout.xs="column">
  <div fxLayout="row" fxLayout.xs="column" fxFlex="100%">
      <h1 mat-dialog-title>
          Reason
      </h1>
  </div>
  <div fxLayout="row" fxLayout.xs="column" fxFlex="100%">
      <div fxLayoutAlign="space-between" fxFlex="50%">
          <mat-form-field fxFlex="100" appearance="outline" fxLayoutGap="2%">
              <input matInput autocomplete="off" placeholder="Search here..." type="text" [(ngModel)]="filter"
                  #filterText="ngModel" name="emp1" maxlength="50"
                  (keyup.enter)="search()" name="filter">
          </mat-form-field>
          <button mat-mini-fab color="primary" class="searchButton mat-elevation-z12" style="margin-left: 10px;
    margin-top: 4px;" (click)="search()">
                <i class="fa fa-search"></i>
          </button>
      </div>
  </div>
  <div class="example-container-table mat-elevation-z8" style="margin-bottom: 2rem">
      <table mat-table [dataSource]="dataSource" width="100%">
          <ng-container matColumnDef="Code">
              <th mat-header-cell *matHeaderCellDef> Reason Code </th>
              <td mat-cell *matCellDef="let element; let i = index;"> {{element.reason_code}} </td>
          </ng-container>
          <ng-container matColumnDef="Description">
              <th mat-header-cell *matHeaderCellDef>Reason Description</th>
              <td mat-cell *matCellDef="let element; let i = index;">{{element.reason_name}}
              </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="displayedColumns;sticky:true"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;" [ngClass]="{hovered: row.hovered}"
              (click)="getLoanDetails(row)" (dblclick)="doubleClick(row)" class="a_custom" (mouseover)="row.hovered = true"
              (mouseout)="row.hovered = false"
              [style.background]="highlightedRows.indexOf(row) != -1 ? '#999' : ''">
            </tr>
      </table>
      <mat-paginator [pageSize]="5" showFirstLastButtons></mat-paginator>
  </div>
  <div mat-dialog-actions fxLayoutGap="2%" fxLayoutAlign="center">
      <button mat-button class="false mat-elevation-z12" (click)="onDismiss()">Close</button>
      <button mat-button class="true mat-elevation-z12" (click)="onConfirm()">ok</button>
  </div>
</div>
