<div class="flex-p">
  <mat-card>
    <div class="head">
      <h3>NOC Reports </h3>
    </div>

      <div fxLayout.xs="column" fxLayout="column" class="flex-p" style="margin-top: 50px;">
        <div fxFlex="100" fxLayoutGap="3%" fxLayout.xs="column" id="mg">
          <div fxFlex="50" fxLayoutGap="3%" style="margin-left:20px">
            <mat-form-field fxFlex="45">
              <input matInput #moroToText="ngModel" readonly [matDatepicker]="pickerMT" placeholder="From Date"
                required name="moroto" [(ngModel)]="field['dueDate']" >
              <mat-datepicker-toggle matSuffix [for]="pickerMT"></mat-datepicker-toggle>
              <mat-datepicker #pickerMT></mat-datepicker>
              <mat-error *ngIf="moroToText.errors?.required">To-Date is required</mat-error>
            </mat-form-field>
            <mat-form-field fxFlex="45">
              <input matInput #moroToText1="ngModel" readonly [matDatepicker]="pickerMT1" placeholder="To Date"
                required name="moroto2" [(ngModel)]="field['presentationDate']" >
              <mat-datepicker-toggle matSuffix [for]="pickerMT1"></mat-datepicker-toggle>
              <mat-datepicker #pickerMT1></mat-datepicker>
              <mat-error *ngIf="moroToText1.errors?.required">To Date is required</mat-error>
            </mat-form-field>
            <div fxFlex="10" fxLayoutAlign="center center">
              <button mat-mini-fab color="primary"
                [disabled]="field['dueDate']==''|| field['dueDate']==null|| !field['dueDate'] || field['presentationDate'] ==''|| field['presentationDate'] ==null || !field['presentationDate']"
                class="mat-elevation-z12 box-button" matTooltip="Search" type="button" color="primary"
                (click)="getcustdaetails()">
                <mat-icon>search</mat-icon>
              </button>
            </div>
        
          </div>    
        </div>
      </div>




    <div>
      <div fxLayout="row" fxLayoutGap="1%" fxLayoutAlign="end" class="myt-1">
        <mat-form-field fxFlex="30%" fxFlex.xs="90%" appearance="outline">
          <mat-label>Search here..with CustomerID</mat-label>
          <input matInput autocomplete="off" placeholder="Search here.." type="text" [(ngModel)]="filter" name="filter"
            (keyup)="filterSource($event.target.value)">
        </mat-form-field>
       
       
      </div>

       <div style="overflow: scroll;-ms-overflow-style: scrollbar;max-height: 390px">
      <table mat-table [dataSource]="dataSource" width="100%">
          <ng-container matColumnDef="slno" >
              <th mat-header-cell *matHeaderCellDef style="width: 120px !important;"> SL. No.</th>
              <td mat-cell *matCellDef="let element; let i = index;" style="width: 120px !important;">{{i+1}} </td>
            </ng-container>
        <ng-container matColumnDef="LoanID">
          <th mat-header-cell *matHeaderCellDef>Loan ID</th>
          <td mat-cell *matCellDef="let element;">
            {{element.loan_no}}
             </td>
        </ng-container>
      
       
      
        <ng-container matColumnDef="settleddate">
          <th mat-header-cell *matHeaderCellDef> Settled Date</th>
          <td mat-cell *matCellDef="let element;">{{element.value_dt | date}} </td>
        </ng-container>
     
       
        <ng-container matColumnDef="view">
          <th mat-header-cell *matHeaderCellDef> View NOC</th>
          <td mat-cell *matCellDef="let element;">
             <mat-icon (click)="changeIcon(element,fileExte,1)" style="background-color: bisque;cursor: pointer;fill:none">visibility</mat-icon>
          </td>
        </ng-container>
       
      
        
        
       
        
       

        <tr mat-header-row *matHeaderRowDef="displayedColumns;sticky:true"></tr>
        <tr mat-row *matRowDef="let element;let row; columns: displayedColumns;" [ngClass]="{hovered: row.hovered}" class="a_custom"
        (click)="viewDocumentImage(element)">
        </tr>
      </table>
      <mat-paginator [pageSize]="5" showFirstLastButtons></mat-paginator>
    </div> 

  </div>

</mat-card>
</div>
