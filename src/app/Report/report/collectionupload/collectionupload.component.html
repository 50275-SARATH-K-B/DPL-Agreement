<div fxLayout="column" fxLayout.gt-sm="row wrap">
  <div fxFlex="100" class="flex-p">
    <form #activityEntryDataUploadForm="ngForm">
      <mat-card fxFlex="100%" fxLayout="column">
        <h2>Data Upload</h2>

        <div fxFlex="30%">
          <button mat-raised-button class="mat-elevation-z12" (click)="exportexcel('tableWithHeader')"
            color="primary">Download Format</button>
        </div>
        <div fxFlex="100%" fxLayoutAlign="end">
          <div fxFlex="100%" fxLayout.xs="column" fxLayoutGap=2% fxLayoutAlign="end">
            <label>
              <input type='file' (change)="addfile($event)" accept=".xls, .xlsx" placeholder="Upload file" #document>
            </label>
          </div>
        </div>
        <div style="margin-top: 2rem;">
          <table mat-table [dataSource]="eligibilitySource">
            <ng-container matColumnDef="SlNo">
              <th mat-header-cell *matHeaderCellDef> SlNo </th>
              <td mat-cell *matCellDef="let element ;  let i= index"> {{i+1}} </td>
            </ng-container>
            <ng-container matColumnDef="LoanNumber">
              <th mat-header-cell *matHeaderCellDef> LoanNumber </th>
              <td mat-cell *matCellDef="let element"> {{element.customerID}} </td>
            </ng-container>
            <ng-container matColumnDef="Date">
              <th mat-header-cell *matHeaderCellDef> Date </th>
              <td mat-cell *matCellDef="let element"> {{element.eligibilityupdatedDate}} </td>
            </ng-container>
            <ng-container matColumnDef="Amount">
              <th mat-header-cell *matHeaderCellDef> Amount </th>
              <td mat-cell *matCellDef="let element">{{element.eligibilityAmount}} </td>
            </ng-container>
            <ng-container matColumnDef="PaymentMode">
              <th mat-header-cell *matHeaderCellDef> PaymentMode </th>
              <td mat-cell *matCellDef="let element">{{element.customerCategory}} </td>
            </ng-container>
            <ng-container matColumnDef="remarks">
              <th mat-header-cell *matHeaderCellDef> Remarks </th>
              <td mat-cell *matCellDef="let element">{{element.customerprofile}} </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
          </table>
        </div>

        <div fxLayoutGap="2%" fxLayoutAlign="end">
          <button type="submit" class="button-box box" mat-raised-button color="primary"
            [disabled]="eligibilitySource== undefined || eligibilitySource.data.length== 0"
            (click)="savedata(activityEntryDataUploadForm)" id="confirm_btn">Confirm</button>
          <button mat-raised-button class="button-box box" color="primary" (click)="clear(activityEntryDataUploadForm)"
            id="clear_btn">Clear</button>
        </div>
        <div fxFlex="100%" style="visibility: hidden;">
          <table class="table table-bordered" id="tableWithHeader">
            <thead>
              <tr>
                <th>LoanNumber</th>
                <th>Date</th>
                <th>Amount</th>
                <th>PaymentMode</th>
                <th>Remarks</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
              </tr>
            </tbody>
          </table>
        </div>
      </mat-card>
    </form>
  </div>
</div>
