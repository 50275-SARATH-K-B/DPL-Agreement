<div class="flex-p">
  <mat-card>
    <div class="head">
      <h3>Loan Account Status Request</h3>
    </div>

    <div fxLayout.xs="column" fxLayout="row" class="flex-p" style="margin-top: 50px;" fxLayoutAlign="center center"
      fxLayoutGap="5%">
      <div fxFlex="100" fxLayoutGap="3%" fxLayout.xs="column" id="mg">
        <div fxFlex="100" fxLayoutGap="3%" style="margin-left:20px" fxLayoutAlign="center center">
          
          <mat-form-field fxFlex="35" >
            <mat-label>Loan ID</mat-label>
            <input matInput [(ngModel)]="enterID" name="enterid" autocomplete="off" readonly (click)="SearchById()">
          </mat-form-field>

          <mat-form-field fxFlex="35" >
            <mat-label>Current Loan Status</mat-label>
            <input matInput [(ngModel)]="status" name="loanStatus" autocomplete="off" readonly>
          </mat-form-field>

        </div>
      </div>
   </div>

   <div fxLayout.xs="column" fxLayout="row" class="flex-p" style="margin-top: 50px;" fxLayoutAlign="center"
   fxLayoutGap="5%">
    <mat-form-field fxFlex="35%">
      <input matInput #deathDateText="ngModel" readonly [matDatepicker]="pickerMT" placeholder="Death Date"
        required name="death_date" [(ngModel)]="deathDate" [max]="maxDate" >
      <mat-datepicker-toggle matSuffix [for]="pickerMT"></mat-datepicker-toggle>
      <mat-datepicker #pickerMT></mat-datepicker>
      <!-- <mat-error *ngIf="deathDateText.errors?.required">Death Date required</mat-error> -->
    </mat-form-field>
    <div fxFlex="33.33%" fxLayout.xs="column" fxLayoutGap=2% fxLayoutAlign="center center">
      <mat-label>Death Certificate</mat-label>
       <input type="file" accept="image/*,.pdf" name="Filename" id="File" #fileInput (change)="onSelectFile($event,1)">
    </div>
    <div fxFlex="33.33%" fxLayout.xs="column" fxLayoutGap=2% fxLayoutAlign="center center">
      <mat-label>Legal Document</mat-label>
      <input type="file" accept="image/*,.pdf" name="Filename2" id="File2" (change)="onSelectFile($event,2)">
   </div>
   </div>

   <div fxLayout="row" fxLayout.xs="column" fxLayoutGap="2%" fxflex="100%" fxLayoutAlign="end" style="margin-top: 30px;">
    <div fxLayoutGap="3%" fxFlex="30" fxLayout.xs="row">
      <button mat-button style="color:rgb(39, 195, 238)" class="false mat-elevation-z12" (click)="back()">Back</button>
      <button mat-button style="color:rgb(85, 237, 118)" class="true mat-elevation-z12" (click)="approve()"
      [disabled]="!enterID || !deathDate || !deathCert || !legalDoc">Request</button>
      <button mat-button color="warn" class="false mat-elevation-z12" (click)="reject()">clear</button>
    </div>
  </div>

</mat-card>
</div>
