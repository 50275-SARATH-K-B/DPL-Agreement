<div class="flex-p">
  <mat-card>
    <div class="head">
      <h3>KYC Verification</h3>
    </div>

    <div fxLayout.xs="column" fxLayout="row" class="flex-p" style="margin-top: 50px;" fxLayoutAlign="center" fxLayoutGap="5%">
      <div fxFlex="100" fxLayoutGap="3%" fxLayout.xs="column" id="mg">
        <div fxFlex="100" fxLayoutGap="3%" style="margin-left:20px">
          <mat-form-field fxFlex="50">
            <input matInput #moroToText="ngModel" readonly [matDatepicker]="pickerMT" placeholder="From Date"
              required name="moroto" [(ngModel)]="dueDate" >
            <mat-datepicker-toggle matSuffix [for]="pickerMT"></mat-datepicker-toggle>
            <mat-datepicker #pickerMT></mat-datepicker>
            <mat-error *ngIf="moroToText.errors?.required">To-Date is required</mat-error>
          </mat-form-field>
          <mat-form-field fxFlex="50">
            <input matInput #moroToText1="ngModel" readonly [matDatepicker]="pickerMT1" placeholder="To Date"
              required name="moroto2" [(ngModel)]="presentationDate" >
            <mat-datepicker-toggle matSuffix [for]="pickerMT1"></mat-datepicker-toggle>
            <mat-datepicker #pickerMT1></mat-datepicker>
            <mat-error *ngIf="moroToText1.errors?.required">To Date is required</mat-error>
          </mat-form-field>

          <div fxFlex="10" fxLayoutAlign="center center">
            <button mat-mini-fab color="primary"
              [disabled]="dueDate==''|| dueDate==null|| !dueDate || presentationDate ==''|| presentationDate ==null || !presentationDate"
              class="mat-elevation-z12 box-button" matTooltip="Search" type="button" color="primary"
              (click)="getKycdetails()">
              <mat-icon>search</mat-icon>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div style="overflow: scroll;-ms-overflow-style: scrollbar;max-height: 390px;text-align: center;">
      <table mat-table [dataSource]="dataSource" width="100%">
          <ng-container matColumnDef="slno" >
              <th mat-header-cell *matHeaderCellDef style="width: 120px !important;text-align: center;"> SL. No.</th>
              <td mat-cell *matCellDef="let element; let i = index;" style="width: 120px !important;">{{i+1}} </td>
            </ng-container>
        <ng-container matColumnDef="custid">
          <th mat-header-cell *matHeaderCellDef style="text-align: center;">customer ID</th>
          <td mat-cell *matCellDef="let element;">{{element.CustomerID}} </td>
        </ng-container>
      
        <ng-container matColumnDef="adharid">
          <th mat-header-cell *matHeaderCellDef style="text-align: center;"> Aadhar Id </th>
          <td mat-cell *matCellDef="let element;">{{element.AadharNumber}}</td>
        </ng-container>
      
        <ng-container matColumnDef="panId">
          <th mat-header-cell *matHeaderCellDef style="text-align: center;"> Pan Id </th>
          <td mat-cell *matCellDef="let element;">{{element.PANNO}} </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns;sticky:true"></tr>
        <tr mat-row *matRowDef="let element;let row; columns: displayedColumns;" [ngClass]="{hovered: row.hovered}" class="a_custom"
        (click)="viewDocumentImage(element)">
        </tr>
      </table>
      <mat-paginator [pageSize]="5" showFirstLastButtons></mat-paginator>
    </div> 
  </mat-card>
</div>
