<div class="flex-p">
  <mat-card>
    <!-- <div class="head">
      <h3>VERIFICATION</h3>
    </div> -->
    <!-- <h2 class="h2-head">
      <mat-icon class="home-icon" routerLink="/home">home</mat-icon>HOME/VERIFICATION
    </h2>
     -->
    <div fxLayout="row" fxLayoutGap="5%" fxflex="50%" fxLayoutAlign="center" style="margin-top:30px ;">
      <div fxLayoutGap="2%" fxFlex="30" fxLayoutAlign="center">
        <mat-card-content class="image-content" fxLayoutAlign="center">
          <div class="snapshot">
            <img [height]="170" [width]="200" [src]="imageData" />
          </div>
        </mat-card-content>
      </div>
    </div>

    <div fxLayout="row" fxLayout.xs="column" fxLayoutGap="2%" fxflex="100%" fxLayoutAlign="center">
      <mat-form-field fxFlex="25%" appearance="outline">
        <mat-label>customer Id</mat-label>
        <input matInput [(ngModel)]="custid" name="custid" autocomplete="off" readonly>
      </mat-form-field>

      <mat-form-field fxFlex="25%" appearance="outline">
        <mat-label>pan Id</mat-label>
        <input matInput [(ngModel)]="panid" name="panid" autocomplete="off" readonly>
      </mat-form-field>

      <mat-form-field fxFlex="25%" appearance="outline">
        <mat-label>Aadhar Id</mat-label>
        <input matInput [(ngModel)]="adharid" name="adhar" autocomplete="off" readonly>
      </mat-form-field>

    </div>

    <div fxLayout="row"  fxLayoutGap="5%" fxflex="100%" fxLayoutAlign="center" style="margin-top: 15px;">
      <div fxLayout="row" fxLayout.xs="column" fxLayoutGap="2%" fxflex="100%" fxLayoutAlign="center">
      
        <div>
          <h3> Aadhar Front Bottom </h3>
          <mat-card-content class="image-content" fxLayoutAlign="center">
            <div class="zoom">
              <img [height]="200" [width]="300" [src]="adharData2" />
            </div>
            <!-- <div class="zoom" (click)="edit(2)">
              <img [height]="200" [width]="300" [src]="adharData2" />
            </div> -->
          </mat-card-content>
          <div style="display: flex;justify-content: space-between" fxLayoutAlign="end">
          <button mat-button (click)="download(1)">Download</button>
          <!-- <button mat-button (click)="edit(2)">Mask</button> -->
        </div>
      </div>
      
    </div>
    <div fxLayout="row" fxLayout.xs="column" fxLayoutGap="2%" fxflex="100%" fxLayoutAlign="center"
      style="margin-top: 50px;">
     
        <div>
          <h3>Aadhar Back</h3>

          <mat-card-content class="image-content">
            <div class="zoom">
              <img [height]="200" [width]="300" [src]="adharData1" />
            </div>
            <!-- <div class="zoom" (click)="edit(1)">
              <img [height]="200" [width]="300" [src]="adharData1" />
            </div> -->
          </mat-card-content>
          <div style="display: flex;justify-content: space-between" fxLayoutAlign="end">
          <button mat-button (click)="download(2)">Download</button>
          <!-- <button mat-button (click)="edit(1)">Mask</button> -->
        </div>
        </div>
     
    </div>


    <div fxLayout="row" fxLayout.xs="column" fxLayoutGap="2%" fxflex="100%" fxLayoutAlign="center">
      
        <div>
          <h3> PAN </h3>
          <mat-card-content class="image-content" fxLayoutAlign="center">
            <div class="zoom">
              <img [height]="200" [width]="300" [src]="panData" />
            </div>
            <!-- <div class="zoom" (click)="edit(3)">
              <img [height]="200" [width]="300" [src]="panData" />
            </div> -->
          </mat-card-content>
          <div style="display: flex;justify-content: space-between" fxLayoutAlign="end">
          <button mat-button  (click)="download(3)">Download</button>
          <!-- <button mat-button  (click)="edit(3)">Mask</button> -->
        </div>
        </div>
      
    
    </div><br>
  </div>
    <div fxLayout="row" fxLayout.xs="column" fxLayoutGap="2%" fxflex="100%" fxLayoutAlign="end" style="margin-top: 30px;">
      <div></div>
      <div fxLayoutGap="3%" fxFlex="30" fxLayout.xs="row">
        <button mat-button style="color:rgb(39, 195, 238)" class="false mat-elevation-z12" (click)="back()">Back</button>
        <button mat-button style="color:rgb(85, 237, 118)" class="true mat-elevation-z12" (click)="approve()">Approve</button>
        <button mat-button color="warn" class="false mat-elevation-z12" (click)="reject()">Reject</button>
      </div>
    </div>
  </mat-card>
</div>
