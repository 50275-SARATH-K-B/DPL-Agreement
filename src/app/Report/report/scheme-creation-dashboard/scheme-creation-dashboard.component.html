<div class="flex-p" fxLayout="column">
  <mat-card>
    <mat-card-content fxLayout="column" fxLayoutGap="3%">


      <div fxLayout="row" fxLayoutGap="1%" fxLayoutAlign="start" class="myt-1">
        <form [formGroup]="schemeCreation" fxLayout="row" fxLayoutGap="2%" fxLayoutAlign="start" class="myt-1" fxFlex="80%">

      <mat-form-field fxFlex="80%" [class.disabled]="true">
        <input matInput [matDatepicker]="picker" 
        name="FromDate" formControlName="FromDate" (ngModelChange)="valuecheck('FromDate')"
        placeholder="Select Scheme From Date">
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
        <mat-hint>DD/MM/YYYY</mat-hint>
    </mat-form-field>


    <mat-form-field fxFlex="80%" [class.disabled]="true">
      <input matInput [matDatepicker]="picker1" 
      name="ToDate" formControlName="ToDate" (ngModelChange)="valuecheck('ToDate')"
      placeholder="Select Scheme To Date">
      <mat-datepicker-toggle matSuffix [for]="picker1"></mat-datepicker-toggle>
      <mat-datepicker #picker1></mat-datepicker>
      <mat-hint>DD/MM/YYYY</mat-hint>
    </mat-form-field>

            <button matTooltip="Search" class="mat-elevation-z12 box-button" type="button" color="primary"
          (click)="searchapi()" [disabled]="!schemeCreation.valid" mat-mini-fab>
          <mat-icon>search</mat-icon>
        </button>
      </form>


        <div fxFlex="20%"></div>
        <mat-form-field fxFlex="25%">
          <mat-label>Search here..</mat-label>
          <input matInput autocomplete="off" placeholder="Search here.." type="text" [(ngModel)]="filter" name="filter"
            (keyup)="filterSource($event.target.value)">
        </mat-form-field>

        <!-- <button matTooltip="Search" class="mat-elevation-z12 box-button" type="button" color="primary"
          (click)="search()" mat-mini-fab>
          <mat-icon>search</mat-icon>
        </button> -->
      </div>


          <div style="overflow:scroll;-ms-overflow-style: -ms-autohiding-scrollbar; margin:1%;">
            <table mat-table [dataSource]="dataSource">
              <ng-container matColumnDef="scheme_id">
                <th mat-header-cell *matHeaderCellDef> Scheme Id</th>
                <td mat-cell *matCellDef="let element">
                  <div *ngIf="element.status==1" style="color: blue;text-decoration: underline;" (click)="gotoapproval(element)" >{{element.scheme_id}}</div>  
                  <div *ngIf="element.status!=1">{{element.scheme_id}}</div>  
                </td>
              </ng-container>
              <ng-container matColumnDef="schemE_NAME">
                <th mat-header-cell *matHeaderCellDef> Scheme Name </th>
                <td mat-cell *matCellDef="let element"> {{element.schemE_NAME}} </td>
              </ng-container>
              <ng-container matColumnDef="validitY_FROM">
                <th mat-header-cell *matHeaderCellDef> Scheme Start Date </th>
                <td mat-cell *matCellDef="let element"> {{datefuncc(element.validitY_FROM)}} </td>
              </ng-container>
              <ng-container matColumnDef="validitY_TO">
                <th mat-header-cell *matHeaderCellDef>Scheme End Date </th>
                <td mat-cell *matCellDef="let element"> {{datefuncc(element.validitY_TO)}} </td>
              </ng-container>
              <ng-container matColumnDef="status">
                <th mat-header-cell *matHeaderCellDef>Status </th>
                <td mat-cell *matCellDef="let element"> 
                  <button mat-raised-button *ngIf="element.status==2" style="background-color:rgb(1, 180, 43);color:white;width:100px;">Approved</button>
                  <button mat-raised-button *ngIf="element.status==0" style="background-color:rgb(223, 2, 2);color:white;width:100px;">Rejected</button>
                  <button mat-raised-button *ngIf="element.status==1" style="background-color:#ffd740;color:white;width:100px;">Requested</button>  
                </td>
              </ng-container>
              <ng-container matColumnDef="view">
                <th mat-header-cell *matHeaderCellDef> View </th>
                <td mat-cell *matCellDef="let element"> 
                <div fxLayout="row" fxLayoutGap="3%">
                  <button mat-raised-button (click)="view(element)" style="color:blue;">View</button>
                  <button mat-raised-button *ngIf="element.status==1" (click)="edit(element)"  style="background-color:#3f51b5;"><mat-icon>edit</mat-icon></button>
                </div>  
                </td>
              </ng-container>
              <tr mat-header-row *matHeaderRowDef="displayedColumns;sticky:true"></tr>
              <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>
            <mat-paginator #paginator [pageSize]="5" showFirstLastButtons></mat-paginator>
          </div>


    </mat-card-content>
  </mat-card>
</div>
