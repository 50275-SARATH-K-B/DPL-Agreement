<div fxLayout="column" fxLayout.gt-sm="row wrap">
  <div fxFlex="100" class="flex-p">
    <form #activityEntryDataUploadForm="ngForm">
    <mat-card>
      <div class="head">
        <h3> UPLOAD</h3>
      </div>
    
      <div fxLayout="column" fxLayoutGap="2%">
        <div fxFlex="100%" fxLayoutGap="2%">
          <div fxFlex="30%">
            <button mat-raised-button class="mat-elevation-z12" (click)="exportexcel('tableWithHeader')"
              color="primary">Download Format</button>
          </div>
          <div fxFlex="60%" fxLayoutAlign="end">
            <div fxLayout.xs="column" fxLayoutGap=2% fxLayoutAlign="end">
              <input style="visibility: hidden;" type='file'
                accept="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" (change)="addfile($event)"
                #document>
              <button mat-raised-button color="primary" (click)="document.click()"
                class="mat-elevation-z12 box-button swing">
                Upload EXCEL </button>
              <!-- <label>
              <input  type='file' accept="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" (change)="onSelectFile($event)"
              #document
              (change)="addfile($event)" accept=".xls, .xlsx" placeholder="Upload Excel"
             #document>
            </label> -->
            </div>
          </div>
        </div>
        <div style="overflow:scroll;-ms-overflow-style: scrollbar; max-height:410px;">
          <table mat-table [dataSource]="enachSource">
            <!-- <ng-container matColumnDef="LoanID">
              <th mat-header-cell *matHeaderCellDef>LoanID</th>
              <td mat-cell *matCellDef="let element"> {{element.loanid}} </td>
            </ng-container>
            <ng-container matColumnDef="CustomerName">
              <th mat-header-cell *matHeaderCellDef>CustomerName</th>
              <td mat-cell *matCellDef="let element"> {{element.customerName}} </td>
            </ng-container> -->
            <ng-container matColumnDef="customerID">
              <th mat-header-cell *matHeaderCellDef>LoanID</th>
              <td mat-cell *matCellDef="let element"> {{element.customerID}} </td>
            </ng-container>
            <ng-container matColumnDef="customerName">
              <th mat-header-cell *matHeaderCellDef>CustomerName</th>
              <td mat-cell *matCellDef="let element"> {{element.customerName}} </td>
            </ng-container>
            <ng-container matColumnDef="customerprofile">
              <th mat-header-cell *matHeaderCellDef> Description </th>
              <td mat-cell *matCellDef="let element "> {{element.customerprofile}} </td>
            </ng-container>
            <ng-container matColumnDef="eligibilityAmount">
              <th mat-header-cell *matHeaderCellDef>Amount</th>
              <td mat-cell *matCellDef="let element"> {{element.eligibilityAmount}} </td>
            </ng-container>
          
          
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
          </table>
        </div>
        <div fxLayoutGap="2%" fxLayoutAlign="end">
          <button type="submit" class="button-box box" mat-raised-button color="primary"
            [disabled]="enachSource== undefined || enachSource.data.length== 0 ||disabled"
            (click)="savedata(activityEntryDataUploadForm)" id="confirm_btn">Confirm</button>
          <button mat-raised-button class="button-box box" color="primary" (click)="clear(activityEntryDataUploadForm)"
            id="clear_btn">Clear</button>
        </div>
        <div fxFlex="100%" style="visibility: hidden;">
      <table class="table table-bordered" id="tableWithHeader">
        <thead>
          <tr>
          
   <th>Loan_ID</th>
   <th>Customer_Name</th>
   <th>Description</th>
   <th>Amount</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
           
          </tr>
        </tbody>
      </table>
    </div>
      </div>
    </mat-card>
    </form>
  </div>
</div>
