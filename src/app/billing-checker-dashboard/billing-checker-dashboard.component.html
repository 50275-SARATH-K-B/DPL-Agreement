<mat-card fxFlex="100%">
    <!-- <div class="head">
        <h3>BILLING CHECKER PENDING DASHBOARD</h3>
    </div> -->
    <!-- <h2 class="h2-head">
        <mat-icon class="home-icon" routerLink="/home">home</mat-icon>Home/Billing Checker Pending Dashboard
    </h2> -->
    <div fxLayoutGap="2%">
        <mat-form-field fxFlex="30%" fxFlex.xs="90%" appearance="outline">
            <input matInput autocomplete="off" placeholder="Search here..." type="text"
                (keydown.Tab)="applyFilter($event)" (keyup)="applyFilter($event)" name="filters">
        </mat-form-field>
    </div>

    <div style="overflow: scroll;-ms-overflow-style: scrollbar;max-height: 390px; margin-top: 30px;">

        <table mat-table matSort [dataSource]="dataSource">
            <ng-container matColumnDef="slno">
                <th mat-header-cell *matHeaderCellDef>SL. No.</th>
                <td mat-cell *matCellDef="let element; let i = index;">{{i+1}}</td>
            </ng-container>
            <ng-container matColumnDef="cin">
                <th mat-header-cell *matHeaderCellDef>Date of the Billing</th>
                <td mat-cell *matCellDef="let element">{{element.company}}</td>
            </ng-container>
            <ng-container matColumnDef="company">
                <th mat-header-cell *matHeaderCellDef>Total Billed Loan Count</th>
                <td mat-cell *matCellDef="let element">{{element.name}}</td>
            </ng-container>
            <ng-container matColumnDef="term">
                <th mat-header-cell *matHeaderCellDef>Billed EMI Amount</th>
                <td mat-cell *matCellDef="let element">{{element.term}}</td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="displayedColumns;sticky:true" style="background-color: #00563B;">
            </tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
        <mat-paginator style="margin-right:10px" [pageSize]="5" showFirstLastButtons></mat-paginator>
    </div>
</mat-card>
